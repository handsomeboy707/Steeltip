services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: steeltip
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run configure.py first}
      SQL_PASSWORD: ${SQL_PASSWORD:?Run configure.py first}
    volumes:
      - sql_data:/var/lib/mysql
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./sql/002_permissions.sh:/docker-entrypoint-initdb.d/002_permissions.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run configure.py first}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Run configure.py first}
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/001_init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.getSiblingDB('admin').auth('root',process.env.MONGO_INITDB_ROOT_PASSWORD); if (!db.getSiblingDB('steeltip').getUser('steeltip_app')) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    env_file: .env
    environment:
      SQL_HOST: mariadb
      SQL_USER: steeltip_app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy
volumes:
  sql_data:
  mongo_data:
